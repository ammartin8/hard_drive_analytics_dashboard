version: 2

sources:
  - name: hard_drive_dataset
    description: "Primary source for hard drive hardware and operational telemetry data."
    tables:
      - name: dim_date
        description: "Dimension table containing calendar hierarchy (Day, Month, Year, Quarter) derived from raw dates."
        columns:
          - name: date_day
            data_type: date
            description: "The original full date of the snapshot (YYYY-MM-DD)."
          - name: year_number
            data_type: int64
            description: "Calendar year extracted from the snapshot date (e.g., 2023)."
          - name: month_number
            data_type: string
            description: "Month index extracted from date (e.g., '1' for January)."
          - name: year_month
            data_type: string
            description: "Concatenation of Year and Month (e.g., '2023-1')."
          - name: day_number
            data_type: string
            description: "Day of the month within its respective year."
          - name: day_of_week
            data_type: int64
            description: "Day of week integer (0=Sunday, 1=Monday, etc.)."
          - name: day_of_year
            data_type: string
            description: "Ordinal day number within the calendar year (e.g., 1 = Jan 1st)."
          - name: week_of_year
            data_type: string
            description: "ISO week number of the year."
          - name: quarter_number
            data_type: int64
            description: "Calendar quarter integer (1, 2, 3, or 4)."
          - name: month_name
            data_type: string
            description: "Full text name of the month (e.g., 'January')."
          - name: day_name
            data_type: string
            description: "Full text name of the day (e.g., 'Monday')."
          - name: month_year_name
            data_type: string
            description: "Combined formatted string like 'January 2023'."

      - name: dim_device_inventory
        description: "Static dimension table mapping serial numbers to hardware specifications and manufacturer details."
        columns:
          - name: serial_number
            data_type: string
            description: "Unique identifier for the hard drive device (GUID/UUID)."
          - name: model
            data_type: string
            description: "Hardware model number of the drive."
          - name: manufacturer
            data_type: string
            description: "Manufacturing brand (e.g., Seagate, Western Digital)."
          - name: capacity_gigabytes
            data_type: float64
            description: "Nominal storage capacity in GB."

      - name: fct_drive_health_snapshots
        description: "Fact table containing periodic health telemetry and failure flags for each drive snapshot."
        columns:
          - name: report_date
            data_type: date
            description: "Date this specific health snapshot was recorded."
          - name: year_number
            data_type: int64
            description: "Calendar year of the snapshot (matches dim_date.year_number)."
          - name: month_number
            data_type: string
            description: "Month index of the snapshot."
          - name: day_number
            data_type: string
            description: "Day of the month for the snapshot."
          - name: day_of_week
            data_type: int64
            description: "Day of week integer for the snapshot date."
          - name: day_of_year
            data_type: string
            description: "Ordinal day number for the snapshot date."
          - name: week_of_year
            data_type: string
            description: "ISO week number for the snapshot date."
          - name: quarter_number
            data_type: int64
            description: "Calendar quarter of the snapshot."
          - name: month_name
            data_type: string
            description: "Full text month name for the snapshot."
          - name: day_name
            data_type: string
            description: "Full text day name for the snapshot."
          - name: year_month
            data_type: string
            description: "Year-Month identifier (YYYY-MM) for the snapshot."
          - name: month_year_name
            data_type: string
            description: "Formatted month-year string (e.g., 'January 2023')."
          - name: datacenter
            data_type: string
            description: "Datacenter location where the drive resides."
          - name: cluster_id
            data_type: int64
            description: "Logical cluster identifier within the storage infrastructure."
          - name: vault_id
            data_type: int64
            description: "Vault or rack-level identification ID."
          - name: pod_id
            data_type: int64
            description: "Pod-level identifier within a specific rack/chassis."
          - name: pod_slot_num
            data_type: float64
            description: "Physical slot number of the drive in the device (converted to float)."
          - name: manufacturer
            data_type: string
            description: "Drive manufacturer at time of snapshot."
          - name: model
            data_type: string
            description: "Drive model number at time of snapshot."
          - name: capacity_gigabytes
            data_type: float64
            description: "Observed capacity in GB at time of snapshot."
          - name: serial_number
            data_type: string
            description: "Unique device identifier linking to dim_device_inventory."
          - name: unique_device_event_id
            data_type: string
            description: "Unique ID for the specific health telemetry event or failure incident."
          - name: failure
            data_type: int64
            description: "Binary flag (0/1) indicating if a hardware failure occurred in this snapshot window."
          - name: smart_5_normalized
            data_type: float64
            description: "Normalized value for S.M.A.R.T. Attribute ID 5 (Reallocated Sector Count)."
          - name: smart_5_raw
            data_type: float64
            description: "Raw value read directly from the drive controller for Attribute 5."
          - name: smart_187_normalized
            data_type: float64
            description: "Normalized value for S.M.A.R.T. Attribute ID 187 (Temperature)."
          - name: smart_187_raw
            data_type: float64
            description: "Raw value read directly from the drive controller for Attribute 187."
          - name: smart_188_normalized
            data_type: float64
            description: "Normalized value for S.M.A.R.T. Attribute ID 188 (Read Error Rate)."
          - name: smart_188_raw
            data_type: float64
            description: "Raw value read directly from the drive controller for Attribute 188."
          - name: smart_197_normalized
            data_type: float64
            description: "Normalized value for S.M.A.R.T. Attribute ID 197 (Write Error Rate)."
          - name: smart_197_raw
            data_type: float64
            description: "Raw value read directly from the drive controller for Attribute 197."
          - name: smart_198_normalized
            data_type: float64
            description: "Normalized value for S.M.A.R.T. Attribute ID 198 (Current Pending Sector Count)."
          - name: smart_198_raw
            data_type: float64
            description: "Raw value read directly from the drive controller for Attribute 198."