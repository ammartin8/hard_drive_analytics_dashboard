version: 2

sources:
  - name: source_hard_drive_data
    description: Raw hard drive failure data from Backblaze
    database: |
      {%- if target.type == 'bigquery' -%}
        {{ env_var('GCP_PROJECT_ID', 'my-project-id') }}
      {%- else -%}
        hard_drive_data
      {%- endif -%}
    schema: |
      {%- if target.type == 'bigquery' -%}
        hard_drive_dataset
      {%- else -%}
        hard_drive_dataset
      {%- endif -%}
    tables:
      - name: hard_drive_data_tbl_ext
        description: ""
        columns:
          - name: date
            data_type: int64
            description: Unix timestamp (microseconds) representing the recording date.
          - name: serial_number
            data_type: string
            description: Unique identifier for the hard drive unit.
          - name: model
            data_type: string
            description: Model number of the hard drive.
          - name: capacity_bytes
            data_type: int64
            description: Total storage capacity in bytes.
          - name: failure
            data_type: int64
            description: Indicator flag (1) if the drive failed, 0 otherwise.
          - name: datacenter
            data_type: string
            description: Location of the data center housing the drive.
          - name: cluster_id
            data_type: int64
            description: Unique identifier for the storage cluster.
          - name: vault_id
            data_type: int64
            description: Identifier for the storage vault or rack.
          - name: pod_id
            data_type: int64
            description: Identifier for the drive pod/enclosure.
          - name: pod_slot_num
            data_type: float64
            description: Numerical slot position within the pod.
          - name: is_legacy_format
            data_type: boolean
            description: Flag indicating if the data uses legacy schema format.
          - name: smart_5_normalized
            data_type: float64
            description: Normalized value for SMART attribute 5 (Reallocated Sectors).
          - name: smart_5_raw
            data_type: float64
            description: Raw reading for SMART attribute 5.
          - name: smart_187_normalized
            data_type: float64
            description: Normalized value for SMART attribute 187 (Read Error Rate).
          - name: smart_187_raw
            data_type: float64
            description: Raw reading for SMART attribute 187.
          - name: smart_188_normalized
            data_type: float64
            description: Normalized value for SMART attribute 188 (Media and Data Integrity Errors).
          - name: smart_188_raw
            data_type: float64
            description: Raw reading for SMART attribute 188.
          - name: smart_197_normalized
            data_type: float64
            description: Normalized value for SMART attribute 197 (Current Pending Sector Count).
          - name: smart_197_raw
            data_type: float64
            description: Raw reading for SMART attribute 197.
          - name: smart_198_normalized
            data_type: float64
            description: Normalized value for SMART attribute 198 (Offline Uncorrectable).
          - name: smart_198_raw
            data_type: float64
            description: Raw reading for SMART attribute 198.

      - name: hard_drive_data_tbl
        description: Partitioned and transformed hard drive data with date conversions.
        columns:
          - name: date
            data_type: int64
            description: Unix timestamp (microseconds) representing the recording date.
          - name: date_bq_fmt
            data_type: date
            description: Converted BigQuery DATE type derived from timestamp.
          - name: year_month
            data_type: date
            description: Truncated date representing Year-Month for partitioning/grouping.
          - name: serial_number
            data_type: string
            description: Unique identifier for the hard drive unit.
          - name: model
            data_type: string
            description: Model number of the hard drive.
          - name: capacity_bytes
            data_type: int64
            description: Total storage capacity in bytes.
          - name: failure
            data_type: int64
            description: Indicator flag (1) if the drive failed, 0 otherwise.
          - name: datacenter
            data_type: string
            description: Location of the data center housing the drive.
          - name: cluster_id
            data_type: int64
            description: Unique identifier for the storage cluster.
          - name: vault_id
            data_type: int64
            description: Identifier for the storage vault or rack.
          - name: pod_id
            data_type: int64
            description: Identifier for the drive pod/enclosure.
          - name: pod_slot_num
            data_type: float64
            description: Numerical slot position within the pod.
          - name: is_legacy_format
            data_type: boolean
            description: Flag indicating if the data uses legacy schema format.
          - name: smart_5_normalized
            data_type: float64
            description: Normalized value for SMART attribute 5 (Reallocated Sectors).
          - name: smart_5_raw
            data_type: float64
            description: Raw reading for SMART attribute 5.
          - name: smart_187_normalized
            data_type: float64
            description: Normalized value for SMART attribute 187 (Read Error Rate).
          - name: smart_187_raw
            data_type: float64
            description: Raw reading for SMART attribute 187.
          - name: smart_188_normalized
            data_type: float64
            description: Normalized value for SMART attribute 188 (Media and Data Integrity Errors).
          - name: smart_188_raw
            data_type: float64
            description: Raw reading for SMART attribute 188.
          - name: smart_197_normalized
            data_type: float64
            description: Normalized value for SMART attribute 197 (Current Pending Sector Count).
          - name: smart_197_raw
            data_type: float64
            description: Raw reading for SMART attribute 197.
          - name: smart_198_normalized
            data_type: float64
            description: Normalized value for SMART attribute 198 (Offline Uncorrectable).
          - name: smart_198_raw
            data_type: float64
            description: Raw reading for SMART attribute 198.
